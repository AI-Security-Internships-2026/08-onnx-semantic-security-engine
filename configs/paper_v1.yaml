# ═══════════════════════════════════════════════════════════════════════
# SEMANTICSHIELD Paper Configuration — Version 1
#
# Frozen configuration for all final manuscript experiments.
# Every result in the paper MUST be generated using this config.
#
# To use:
#   from src.semantic_analyzer import SemanticSecurityEngine
#   engine = SemanticSecurityEngine.from_config("configs/paper_v1.yaml")
#
# WARNING: Do NOT modify this file after paper experiments begin.
#          Create paper_v2.yaml if thresholds need to change.
# ═══════════════════════════════════════════════════════════════════════

version: "paper_v1"
frozen_date: "2026-09-11"

# ── Model Configuration ──
model:
  onnx_path: "experiments/threat_mlp_nf_fp32.onnx"
  variant: "NF-Standardized"
  features: 13
  precision: "FP32"
  scaler: "experiments/standard_scaler_nf.joblib"
  encoder: "experiments/label_encoder_nf.joblib"
  reference_embeddings: "experiments/reference_embeddings_nf.npz"
  feature_stats: "experiments/training_feature_stats_nf.json"

# ── Decision Thresholds ──
# Calibrated on CIC-IDS2018 held-out validation set (10,000 samples)
# targeting 5% False Positive Rate
thresholds:
  confidence: 0.4743           # MSP confidence: 5th percentile of in-dist
  cosine_drift: 0.4341         # Cosine distance: 95th percentile of in-dist
  mahalanobis_drift: 18.1593   # Mahalanobis distance: 95th percentile of in-dist
  zscore: 15.0                 # Z-score outlier threshold
  zero_fill_ratio: 0.80        # Zero-fill detection ratio
  range_tolerance_sigmas: 15.0 # Range check tolerance (mean ± N*sigma)

# ── Calibration Methodology ──
calibration:
  method: "empirical_percentile"
  target_fpr: 0.05
  calibration_samples: 10000
  percentile_drift: 95         # 95th percentile for drift thresholds
  percentile_confidence: 5     # 5th percentile for confidence threshold
  source_dataset: "CIC-IDS2018"
  source_filter: "Benign"      # Calibrated on benign traffic only

# ── Evaluation Parameters ──
evaluation:
  seeds: [42, 123, 456, 789, 1024]
  n_calibration: 10000
  n_in_dist: 10000
  n_ood: 10000
  n_noise: 1000
  n_zero: 500
  n_latency_iters: 1000
  ood_dataset: "ToN-IoT/NF-ToN-IoT-V2.parquet"

# ── Verdict Logic ──
# Documented here for paper reference. Implementation is in
# SemanticSecurityEngine.compute_verdict() (src/semantic_analyzer.py)
verdict_rules:
  - "REJECTED:    structural validation fails (NaN, Inf, schema, zero-fill)"
  - "HIGH_RISK:   2+ independent anomaly signals (low conf + drift + soft alerts)"
  - "SUSPICIOUS:  exactly 1 anomaly signal"
  - "CLEAN:       no anomaly signals"

# ── Scoring Equations ──
# Documented here for paper reference. Implementation is canonical in
# src/semantic_analyzer.py (ConfidenceAnalyzer, DriftDetector, InputValidator)
equations:
  msp_confidence: "MSP = max(softmax(logits))"
  cosine_distance: "d_cos = min_c cosine(embedding, centroid_c)"
  mahalanobis_distance: "d_mahal = min_c sqrt((e - μ_c)^T Σ^{-1} (e - μ_c))"
  composite_drift: "drift_score = min(max(d_cos/τ_cos, d_mahal/τ_mahal), 2.0)"
  drift_flag: "DRIFT_DETECTED if d_cos > τ_cos OR d_mahal > τ_mahal"
