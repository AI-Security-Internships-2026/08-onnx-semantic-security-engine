networks:
  sec-engine-net:
    driver: bridge

services:
  # ============================================================================
  # 1. Central ONNX Semantic Security Engine
  # ============================================================================
  security-engine:
    container_name: security-engine
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    ports:
      - "8000:8000"
    environment:
      - USE_NF=true
      - USE_QUANTIZED=false
      - PYTHONUNBUFFERED=1
    networks:
      - sec-engine-net
    restart: unless-stopped

  # ============================================================================
  # 2. 10 Benign / Normal Nodes (In-Distribution Traffic)
  # ============================================================================
  benign-01:
    container_name: benign-01
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    environment:
      - NODE_ID=benign-01
      - NODE_TYPE=benign
      - ENGINE_URL=http://security-engine:8000/predict/secure
      - INTERVAL_SEC=1.2
    depends_on:
      - security-engine
    networks:
      - sec-engine-net

  benign-02:
    container_name: benign-02
